<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <!-- Broad, soft tonal drift of a quarried slab (no veins). Tiles seamlessly. -->
  <filter id="c" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0035" numOctaves="4" seed="5" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.28  0 0 0 0 0.25  0.42 0 0 0 -0.15"/>
  </filter>
  <rect width="900" height="900" filter="url(#c)"/>
</svg>
