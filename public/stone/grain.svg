<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Fine limestone grain: sparse dark and light mineral specks. Tiles seamlessly. -->
  <filter id="dark" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="3" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.24  0 0 0 0 0.225  0 0 0 0 0.2  3.2 0 0 0 -1.72"/>
  </filter>
  <filter id="light" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="29" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.93  0 0 0 0 0.92  0 0 0 0 0.9  0 3 0 0 -1.62"/>
  </filter>
  <rect width="240" height="240" filter="url(#dark)"/>
  <rect width="240" height="240" filter="url(#light)"/>
</svg>
